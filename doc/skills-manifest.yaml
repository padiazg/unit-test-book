# Skills manifest — curated routing table from unit-test-book chapters.
# One row per chapter. Generated skills land in target_dir.
#
# Rules:
#   - `style` ∈ {table, check, simple, manual}
#   - `demand_style: true` → chapter with no row triggers a BUILD ERROR
#   - `route_keys` — flat list; router matches these against function signatures
#   - `notes` — optional LLM-facing guidance for the AI maintenance prompt
#   - `exempt_skills` — never generated/overwritten

router_name: testgen-scenario
router_emoji: "🧭"
shared_dir: shared
target_dir: ../go-testgen/skills
plugin_dir: /home/pato/.agents/skills/go-testgen
exempt_skills: [gen-test-cases, closure-check-tests]
draft_style: check
demand_style: true
require_route_keys: true
strict_semver: true
version: "1.0.0"

chapters:
  1:
    name: pattern-01-table-validation
    style: table
    scenario: "constructor returning (T, error), inputs validated before return"
    route_keys: ["(T, error) constructor", "input validation", "boundary check", "required field", "wantErr"]
  2:
    name: pattern-02-value-assertions
    style: table
    scenario: "pure transform returning a value; compare against want T"
    route_keys: ["pure function", "single return value", "DeepEqual", "want T", "value assertion"]
  3:
    name: pattern-03-fields-struct-inputs
    style: table
    scenario: "function with many input params; group into a struct for test vectors"
    route_keys: ["multiple input params", "input struct", "grouped inputs", "test vector", "params"]
  4:
    name: pattern-04-subtest-naming
    style: table
    scenario: "many related test cases; use descriptive constants or natural names"
    route_keys: ["subtest", "many cases", "descriptive names", "naming", "t.Run"]
  5:
    name: pattern-05-typed-check-functions
    style: check
    scenario: "fn returns multiple values needing field/object-level asserts via closures"
    route_keys: ["composable assertion", "checkXxxFn type", "multi-return", "closure check", "typed check"]
  6:
